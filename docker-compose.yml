services:
  # Our postgreSQL db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: changemeinprod!


  # DB management interface for visual representation
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 18080:8080

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "19090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak-data:/opt/keycloak/data
    command:
      - start-dev
      - --db=dev-file
      - --hostname-strict=false


volumes:
  keycloak-data:
    driver: local
