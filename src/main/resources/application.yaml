server:
  port: 9090

spring:
  application:
    name: tickets
  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_JWT_ISSUER_URI}

debug: true